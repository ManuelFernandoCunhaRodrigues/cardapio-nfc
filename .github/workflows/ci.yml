name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders somente para validar o build; não são segredos de ambiente.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  banco-e-e2e:
    name: banco local e ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Login que só existe no banco local criado neste job.
      E2E_ADMIN_EMAIL: admin@salgae.test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Banco vazio: aplica todas as migrations, na ordem, e depois o seed.
      - name: Sobe o Supabase local
        run: supabase start
      - name: Lê o endereço e a chave pública do banco local
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          read_var() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(read_var API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(read_var ANON_KEY)"
            echo "DB_URL=$(read_var DB_URL)"
          } >> "$GITHUB_ENV"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      # O arquivo de tipos tem de ser o que a CLI gera a partir das migrations.
      - name: Tipos do banco em dia com as migrations
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=lib/supabase/database.types.ts::Os tipos não batem com as migrations. Gere de novo com 'supabase gen types typescript --local --schema public'."
            exit 1
          fi
      - name: Testes de banco (RLS, Storage e reordenação)
        run: bash scripts/testar-banco-local.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Testes de ponta a ponta
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
