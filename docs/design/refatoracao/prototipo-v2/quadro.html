<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Salgaê — quadro de captura 390×844</title>
  <style>html, body { margin: 0; background: #FAF7EF; } iframe { display: block; width: 390px; height: 844px; border: 0; }</style>
</head>
<body>
  <!-- O navegador sem janela não aceita largura menor que ~500 px; este quadro garante a tela de 390 px na captura. -->
  <iframe id="tela" title="Tela do protótipo"></iframe>
  <script>document.getElementById('tela').src = 'index.html' + location.search;</script>
</body>
</html>
